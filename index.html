<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCL Performance Chart</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
  background:#000;
  color:#E8E0D0;
  font-family:Arial, sans-serif;
  padding:20px;
}
.container {
  max-width:900px;
  margin:auto;
}
h1 {
  text-align:center;
  color:#C9A84C;
}
</style>
</head>
<body>
<div class="container">
  <h1>TCL vs IHSG vs IDX30</h1>
  <canvas id="chart"></canvas>
</div>

<script>
const labels = [
'6 Mar','9 Mar','10 Mar','11 Mar','12 Mar','13 Mar',
'16 Mar','17 Mar','25 Mar','26 Mar','27 Mar','30 Mar','31 Mar','1 Apr'
];

const tcl = [-2.06,-1.75,1.08,-2.28,1.08,-1.44,2.10,1.93,0.37,-1.03,0.21,1.88,-1.53,-0.75];
const idx30 = [-2.18,-3.21,0.99,-0.63,0.43,-2.20,-1.12,1.40,3.39,-2.10,-1.92,-0.59,-0.03,1.21];
const ihsg = [-1.65,-3.38,1.39,-0.70,-0.37,-3.15,-1.64,1.19,2.67,-1.93,-0.94,-0.08,-0.62,1.93];

const ctx = document.getElementById('chart').getContext('2d');

new Chart(ctx, {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      {
        label: 'TCL',
        data: tcl,
        borderColor: '#4A9EFF',
        tension: 0.4
      },
      {
        label: 'IHSG',
        data: ihsg,
        borderColor: '#F5C518',
        tension: 0.4
      },
      {
        label: 'IDX30',
        data: idx30,
        borderColor: '#F87171',
        tension: 0.4
      }
    ]
  },
  options: {
    responsive: true,
    plugins: {
      legend: {
        labels: { color: '#E8E0D0' }
      }
    },
    scales: {
      x: {
        ticks: { color: '#E8E0D0' }
      },
      y: {
        ticks: {
          color: '#E8E0D0',
          callback: value => value + '%'
        }
      }
    }
  }
});
</script>
</body>
</html>
